name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Windows-only пакеты в requirements.txt роняют весь CI на ubuntu
    # (pip: "not a supported wheel on this platform"), причём падение
    # выглядит как мгновенный failure без внятного шага. Проверяем ДО
    # установки, чтобы причина была названа прямо.
    # NB: двоеточие в name: брать в кавычки — иначе YAML-сканер рвётся и
    # GitHub помечает workflow как "workflow file issue" и НЕ запускает его.
    - name: "Guard: requirements must stay cross-platform"
      run: |
        if grep -nE '^(pywin32|pywin32-ctypes|pywinpty)==' requirements.txt; then
          echo "::error::requirements.txt contains Windows-only packages."
          echo "Move them to requirements-win.txt - CI installs this file on Linux."
          exit 1
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy

    - name: Lint with ruff (full config)
      run: |
        ruff check sia/ sentinel/ tests/ sdk/ verifier/

    - name: Type check with mypy
      run: |
        mypy sia/ sentinel/ verifier/

    - name: Run test suite with coverage gate
      run: |
        pip install coverage
        coverage run -m unittest discover -s tests -t . -v
        coverage report --fail-under=75

    # Демо — самые производительные охотники за багами проекта
    # (schema-дыра ModelSpec, неподписанная проекция claim, протечка
    # api_keys.json) — потому в CI они обязаны ГРОМКО падать, а не
    # только печатать. Оба самопроверяются ассертами и exit 1.
    - name: Run product demos as executable artifacts
      run: |
        python scripts/demo_full.py
        python scripts/demo_forgery.py

    # P3 (2026-09-14): non-SQLite ветка пула БД (QueuePool/pre-ping —
    # прод-конфиг) не исполнялась ни одним тестом (все гоняются через
    # SQLite-ветку). Дым гоняет полный продуктовый цикл через
    # QueuePool-ветку; живой Postgres-коннект — первый пункт чек-листа
    # дня деплоя (см. докстринг скрипта).
    - name: Run the non-SQLite DB pool smoke
      run: |
        python scripts/postgres_smoke.py

    # CI-checkout — это свежий клон: здесь постоянно живёт обещание
    # «посторонний верифицирует записи сам». Поймано красным 2026-09-14:
    # receipts/ был в .gitignore — локальная зелень, мёртвый клон.
    # Сьют-гард ловит отсутствие файлов; этот шаг доказывает, что обе
    # записи ВЕРИФИЦИРУЮТСЯ в чистом окружении CI. PYTHONPATH вместо
    # pip-install: проверяем код из этого же checkout, не из PyPI.
    # --require-coverage: лаг чекпойнта — красный, не advisory.
    # --issuer-key (2026-09-30): корень доверия. Без него верификатор берёт
    # публичный ключ ИЗ проверяемой аттестации, и одноразовый ключ даёт
    # «валидную» подделку. Якорь задаётся внеполосно, из шага CI.
    # rederive опущен: его проверка №2 дергает живой Rekor API —
    # сетевой сервис в CI-гейте остаётся вне зависимости.
    - name: Verify both public records as a fresh clone would
      env:
        ISSUER_KEY: tqIhnSC/3xVANUtzGLsGmcVqxZ40J1jTiF1QDaQHiyw=
      run: |
        pip install cryptography
        PYTHONPATH=verifier python -m sia_verifier artifacts/record1/attestation.json \
          --chain receipts/registry.jsonl \
          --checkpoint receipts/checkpoints.jsonl --require-coverage \
          --issuer-key "$ISSUER_KEY"
        PYTHONPATH=verifier python -m sia_verifier artifacts/demo-live/attestation.json \
          --chain receipts/registry.jsonl \
          --checkpoint receipts/checkpoints.jsonl --require-coverage \
          --issuer-key "$ISSUER_KEY"

    # Негативный шаг: неверный якорь обязан ломать вердикт. Без него
    # --issuer-key — декоративный флаг, который никто не проверяет.
    - name: Trust anchor actually gates the verdict (negative check)
      env:
        ISSUER_KEY: tqIhnSC/3xVANUtzGLsGmcVqxZ40J1jTiF1QDaQHiyw=
      run: |
        pip install cryptography
        set +e
        PYTHONPATH=verifier python -m sia_verifier artifacts/record1/attestation.json \
          --chain receipts/registry.jsonl \
          --checkpoint receipts/checkpoints.jsonl --require-coverage \
          --issuer-key "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        rc=$?
        set -e
        if [ "$rc" -eq 0 ]; then
          echo "FATAL: wrong trust anchor still produced VERDICT: VALID"
          exit 1
        fi
        echo "wrong anchor correctly rejected (exit $rc)"

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: sia-sentinel:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm sia-sentinel:latest python -c "import sentinel.api; print('OK')"
